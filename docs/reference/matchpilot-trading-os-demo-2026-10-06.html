<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MatchPilot Trading OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: piattaforma di trading — header fisso con navigazione, colonne leghe | contenuto | pannello trading; scoreboard condensato, celle quota exchange BACK azzurro / LAY rosa. Tema scuro scelto di proposito (terminale di trading). */
:root {
  --bg: #0A0F17; --surface: #111823; --surface-2: #16202D; --surface-3: #1D2938; --hover: #1A2533;
  --line: #223042; --line-2: #2C3C51;
  --ink: #E9EFF6; --ink-2: #C3CEDB; --muted: #8494A8; --faint: #5D6C80;
  --accent: #FFB547; --accent-ink: #1A1205; --accent-soft: rgba(255,181,71,.13);
  --back: #5CB2FF; --back-bg: #10324F; --back-bg-2: #15406A;
  --lay: #FF86AB; --lay-bg: #45182A; --lay-bg-2: #5A2036;
  --ok: #3BD69A; --ok-bg: rgba(59,214,154,.13); --warn: #FF9A4D; --warn-bg: rgba(255,154,77,.14);
  --crit: #FF5F6D; --crit-bg: rgba(255,95,109,.14); --info: #8FA8FF; --info-bg: rgba(143,168,255,.13);
  --live: #FF4757;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; margin: 0; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.up { color: var(--ok); } .down { color: var(--crit); }
.sm { font-size: 12.5px; } .xs { font-size: 11.5px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1 1 auto; min-width: 0; }

/* ---------- header ---------- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(10,15,23,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hdr-in { max-width: 1480px; margin: 0 auto; padding: 0 20px; height: 60px; display: flex; align-items: center; gap: 22px; }
.logo { display: flex; align-items: center; gap: 10px; flex: none; cursor: pointer; background: none; border: 0; padding: 0; }
.logo b { font-family: var(--f-display); font-weight: 800; font-size: 23px; letter-spacing: .04em; }
.logo b span { color: var(--accent); }
.mainnav { display: flex; gap: 2px; height: 100%; overflow-x: auto; scrollbar-width: none; }
.mainnav button { background: none; border: 0; padding: 0 13px; height: 100%; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.mainnav button:hover { color: var(--ink); }
.mainnav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.mainnav .cnt { background: var(--live); color: #fff; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 9px; }
.hdr-r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.searchbox { position: relative; }
.searchbox input { width: 230px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px 7px 32px; }
.searchbox svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); }
.iconbtn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; cursor: pointer; position: relative; }
.iconbtn:hover { background: var(--surface-3); }
.iconbtn .badge { position: absolute; top: -4px; right: -4px; background: var(--live); color: #fff; font-size: 10px; font-weight: 700; border-radius: 9px; padding: 0 5px; line-height: 16px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #FFB547, #FF7A59); color: var(--accent-ink); font-weight: 800; display: grid; place-items: center; border: 0; cursor: pointer; font-size: 13px; flex: none; }
.bank { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; padding-right: 4px; }
.bank .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.bank .v { font-family: var(--f-mono); font-weight: 600; font-size: 14px; }
.menu { position: absolute; right: 20px; top: 56px; width: 270px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.45); z-index: 40; }
.menu > button, .menu > label { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 6px; cursor: pointer; font-weight: 500; }
.menu > button:hover, .menu > label:hover { background: var(--surface-3); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 0; }
.menu .who { padding: 8px 10px 10px; }

/* ---------- page ---------- */
.page { max-width: 1480px; margin: 0 auto; padding: 20px; padding-block: 20px 60px; }
.cols3 { display: grid; grid-template-columns: 230px minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.sticky { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card > .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card > .bd { padding: 14px 16px; }
.card h3 { margin: 0; font-size: 13.5px; font-weight: 700; letter-spacing: .01em; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
h1.title { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }

.btn { border: 1px solid var(--line-2); background: var(--surface-2); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--surface-3); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.s { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 6px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
select, input[type=number], input[type=text], input[type=date], textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 600; min-width: 0; }
label.f > * { color: var(--ink); font-weight: 500; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 11px 14px; cursor: pointer; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13.5px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill.back { background: var(--back-bg); color: var(--back); } .pill.lay { background: var(--lay-bg); color: var(--lay); }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.crit { background: var(--crit-bg); color: var(--crit); } .pill.info { background: var(--info-bg); color: var(--info); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.out { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--muted); }
.pill button { background: none; border: 0; padding: 0 0 0 3px; cursor: pointer; color: inherit; font-weight: 800; }
.livedot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); display: inline-block; animation: pulse 1.6s infinite; flex: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,71,87,.55); } 70% { box-shadow: 0 0 0 7px rgba(255,71,87,0); } 100% { box-shadow: 0 0 0 0 rgba(255,71,87,0); } }

/* exchange cells */
.ox { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 58px; padding: 4px 6px; border-radius: 6px; border: 0; cursor: pointer; line-height: 1.1; }
.ox b { font-family: var(--f-mono); font-size: 13.5px; font-weight: 600; }
.ox i { font-style: normal; font-size: 10px; opacity: .75; font-family: var(--f-mono); }
.ox.b { background: var(--back-bg); color: var(--back); } .ox.b:hover { background: var(--back-bg-2); }
.ox.l { background: var(--lay-bg); color: var(--lay); } .ox.l:hover { background: var(--lay-bg-2); }
.ox.n { background: var(--surface-2); color: var(--ink-2); }

/* league sidebar */
.lg h4 { margin: 14px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--faint); font-weight: 700; }
.lg h4:first-child { margin-top: 0; }
.lg button { display: flex; width: 100%; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 7px; background: none; border: 0; cursor: pointer; text-align: left; font-weight: 600; color: var(--ink-2); }
.lg button:hover { background: var(--surface-2); color: var(--ink); }
.lg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.lg button .c { margin-left: auto; font-size: 11.5px; color: var(--faint); font-family: var(--f-mono); }
.lg button .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* date strip */
.dates { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.dates button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.15; min-width: 54px; }
.dates button small { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.dates button b { font-family: var(--f-display); font-size: 19px; }
.dates button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.dates button[aria-pressed="true"] small { color: var(--accent); }

/* match list */
.lgroup { overflow: hidden; }
.lgroup .lh { display: flex; align-items: center; gap: 9px; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-weight: 700; font-size: 13px; }
.lgroup .lh .sub { color: var(--muted); font-weight: 600; }
.mrow { display: grid; grid-template-columns: 54px minmax(0, 1fr) 30px 200px 178px 20px; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.mrow:last-child { border-bottom: 0; }
.mrow:hover { background: var(--hover); }
.mrow .time { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.3; }
.mrow .time.live { color: var(--live); font-weight: 600; }
.mrow .teams { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.mrow .tm { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.mrow .tm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .tm.lose span { color: var(--muted); }
.mrow .sc { display: flex; flex-direction: column; gap: 5px; font-family: var(--f-display); font-weight: 700; font-size: 17px; text-align: center; line-height: 20px; }
.mrow .sc.live { color: var(--live); }
.mrow .odds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.mrow .odds .ox { min-width: 0; }
.mrow .sig { display: flex; justify-content: flex-end; min-width: 0; }
.mrow .sig .pill { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.mrow .chev { color: var(--faint); }

/* right rail widgets */
.sigitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 11px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.sigitem:last-child { border-bottom: 0; }
.sigitem .t { font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sigitem .m { font-size: 12px; color: var(--muted); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.kpi .l { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.kpi .v { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi.flat { background: var(--surface-2); border: 0; padding: 10px 12px; }
.kpi.flat .v { font-size: 22px; }

/* hero (match page) */
.hero { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.hero .bgx { position: absolute; inset: 0; opacity: .22; pointer-events: none; }
.hero .in { position: relative; padding: 18px 22px 0; }
.hero .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-weight: 600; font-size: 13px; }
.hero .board { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 20px; padding: 18px 0 16px; }
.hero .side { display: flex; align-items: center; gap: 14px; min-width: 0; }
.hero .side.r { flex-direction: row-reverse; text-align: right; }
.hero .side b { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1; display: block; overflow: hidden; text-overflow: ellipsis; }
.hero .side .form { display: flex; gap: 3px; margin-top: 6px; }
.hero .side.r .form { justify-content: flex-end; }
.hero .mid { text-align: center; }
.hero .bigscore { font-family: var(--f-display); font-weight: 800; font-size: 56px; line-height: .95; letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero .ko { font-family: var(--f-display); font-weight: 700; font-size: 40px; line-height: 1; }
.fm { width: 20px; height: 20px; border-radius: 5px; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 800; flex: none; }
.fm.W { background: var(--ok); color: #05261A; } .fm.D { background: var(--surface-3); color: var(--ink-2); } .fm.L { background: var(--crit); color: #2B0509; }
.mkt3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 0 16px; }
.mkt3 .sel { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.18); border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px 7px 12px; min-width: 0; }
.mkt3 .sel span:first-child { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hero .tabs { border-bottom: 0; border-top: 1px solid var(--line); margin: 0 -22px; padding: 0 12px; }

.fbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; }

/* stat compare */
.cmp { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; gap: 4px 12px; align-items: center; }
.cmp .l { grid-column: 1 / -1; text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 8px; }
.cmp .n { font-family: var(--f-mono); font-weight: 600; font-size: 13px; cursor: pointer; }
.cmp .n.r { text-align: right; }
.cmp .n:hover { color: var(--accent); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.duo i { display: block; height: 6px; border-radius: 3px; background: var(--surface-3); position: relative; overflow: hidden; }
.duo i u { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.duo i:first-child u { right: 0; background: var(--back); }
.duo i:last-child u { left: 0; background: var(--lay); }
.nd { color: var(--faint); font-style: italic; font-family: var(--f-body); font-weight: 600; }

.heat { display: grid; grid-template-columns: 26px repeat(4, 1fr); gap: 4px; font-size: 12px; }
.heat .ax { color: var(--muted); font-family: var(--f-mono); display: grid; place-items: center; }
.heat .c { border-radius: 6px; padding: 9px 2px; text-align: center; font-family: var(--f-mono); font-weight: 600; cursor: pointer; }
.heat .c.v { box-shadow: inset 0 0 0 2px var(--lay); }

.tbars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; align-items: end; height: 130px; }
.tbars .b { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; cursor: pointer; }
.tbars .b .pair { display: flex; gap: 3px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
.tbars .b .pair i { width: 40%; max-width: 18px; border-radius: 4px 4px 0 0; display: block; }
.tbars .b small { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--hover); }
.teamcell { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }

/* live cards */
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; display: flex; flex-direction: column; }
.lcard.armed { box-shadow: inset 0 3px 0 var(--lay); }
.lcard.active { box-shadow: inset 0 3px 0 var(--ok); }
.lcard .top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-size: 12px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
.lcard .sb { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 14px; cursor: pointer; }
.lcard .sb .t { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; min-width: 0; }
.lcard .sb .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcard .sb .t.r { flex-direction: row-reverse; text-align: right; }
.lcard .sb .s { text-align: center; }
.lcard .sb .s b { font-family: var(--f-display); font-size: 34px; font-weight: 800; line-height: 1; display: block; white-space: nowrap; }
.lcard .sb .s small { font-family: var(--f-mono); color: var(--live); font-weight: 600; font-size: 12px; }
.lcard .mom { padding: 0 14px 6px; }
.lcard .stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px 14px 12px; }
.lcard .stats4 div { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; text-align: center; min-width: 0; }
.lcard .stats4 small { display: block; font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

function spark(vals, w = 120, h = 34, col = 'var(--ok)', fill = true) {
  const mn = Math.min(...vals), mx = Math.max(...vals), sx = w / (vals.length - 1), sy = v => h - 3 - (v - mn) / (mx - mn || 1) * (h - 6);
  const pts = vals.map((v, i) => `${(i * sx).toFixed(1)},${sy(v).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="flex:none">${fill ? `<polygon points="0,${h} ${pts} ${w},${h}" fill="${col}" opacity=".12"/>` : ''}<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${w - 2}" cy="${sy(vals[vals.length - 1]).toFixed(1)}" r="2.6" fill="${col}"/></svg>`;
}
function momentumSVG(series, w, h, opts = {}) {
  const span = opts.span || 95, n = series.length, bw = w / span, mid = h / 2;
  const bars = series.map((v, i) => { const hh = Math.abs(v) * (mid - 6); return `<rect x="${(i * bw + .4).toFixed(1)}" y="${v > 0 ? (mid - hh).toFixed(1) : mid}" width="${Math.max(1, bw - .8).toFixed(1)}" height="${hh.toFixed(1)}" rx="1" fill="${v > 0 ? 'var(--back)' : 'var(--lay)'}" opacity="${(.45 + Math.abs(v) * .55).toFixed(2)}"/>`; }).join('');
  const gaps = (opts.gaps || []).map(([a, b]) => `<rect x="${a * bw}" y="0" width="${(b - a) * bw}" height="${h}" fill="var(--surface-3)"/>`).join('');
  const goals = (opts.goals || []).map(([t, side]) => `<circle cx="${(t * bw).toFixed(1)}" cy="${side ? h - 6 : 6}" r="4.5" fill="#fff"/><circle cx="${(t * bw).toFixed(1)}" cy="${side ? h - 6 : 6}" r="1.8" fill="#111"/>`).join('');
  const ht = n > 45 ? `<line x1="${45 * bw}" x2="${45 * bw}" y1="0" y2="${h}" stroke="var(--line-2)" stroke-dasharray="3 3"/>` : '';
  const cur = opts.cursor != null ? `<line x1="${(opts.cursor * bw).toFixed(1)}" x2="${(opts.cursor * bw).toFixed(1)}" y1="0" y2="${h}" stroke="var(--accent)" stroke-width="2"/>` : '';
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block" role="img" aria-label="Momentum della partita">${gaps}<line x1="0" x2="${w}" y1="${mid}" y2="${mid}" stroke="var(--line-2)"/>${ht}${bars}${goals}${cur}</svg>`;
}
function series(seed, len, bias = 0) { const r = rng(seed); let v = 0; return Array.from({ length: len }, () => { v = v * .55 + (r() - .5 + bias) * 1.1; return Math.max(-1, Math.min(1, v)); }); }

  el.addEventListener('click', e => {
    const t = e.target.closest('[data-st]'); if (t) { SET.tab = t.dataset.st; $$('[data-st]').forEach(x => x.setAttribute('aria-selected', x === t)); drawSet(); return; }
    const p = e.target.closest('[data-perm]'); if (p) { const k = p.dataset.perm; SET.perms.has(k) ? SET.perms.delete(k) : SET.perms.add(k); store.set('perms', [...SET.perms]); p.setAttribute('aria-checked', SET.perms.has(k)); $('#pc').textContent = `${SET.perms.size} di ${PERMS.length} attivi`; toast(`${k}: ${SET.perms.has(k) ? 'concesso' : 'revocato'} e registrato`); return; }
    const s = e.target.closest('[data-sw]'); if (s) s.setAttribute('aria-checked', s.getAttribute('aria-checked') !== 'true');
    const tt = e.target.closest('[data-t]'); if (tt) toast(tt.dataset.t);
    const sw = e.target.closest('[data-sw]'); if (sw && SET.tab === 'ui') saveAcc('Preferenza di visualizzazione aggiornata');
    if (e.target.id === 'atog') { const on = e.target.textContent === 'Sospendi'; e.target.textContent = on ? 'Riattiva' : 'Sospendi'; $('#ast').textContent = on ? 'Sospeso' : 'Attivo'; $('#ast').className = 'pill ' + (on ? 'crit' : 'ok'); }
  });
  el.addEventListener('change', e => {
    const k = e.target.dataset.acc, h = e.target.dataset.hard;
    if (k) { ACC[k] = e.target.type === 'number' ? +e.target.value : e.target.value; saveAcc(k === 'commission' ? `Commissione ${ACC.commission}%: i nuovi calcoli la usano subito` : 'Impostazione aggiornata'); }
    if (h) { ACC.hard[h] = +e.target.value; saveAcc('Limite di sicurezza aggiornato'); }
    if (e.target.id === 'setMM') { MMP.forEach(p => p.def = p.id === e.target.value); saveMMP(); saveAcc('Profilo Money Management predefinito aggiornato'); }
    if (k || h || e.target.id === 'setMM') { $('#accS').innerHTML = accStrip(); drawSet(); }
  });
  drawSet();
};

  const ex = ['Partite in cui l\'ospite sfavorito tra 3 e 5 perdeva 1-0 al 70\' con almeno 3 tiri in porta', 'Ultime 20 trasferte del Girona da favorito tra 1.50 e 1.90', 'Campionati dove il lay 0-0 perde meno dell\'8% delle volte', 'Da quale stagione abbiamo la Serie A?', 'Quali strategie usano il profilo Lay Score?'];
  $('#drawer').innerHTML = `<div class="drawer"><div role="dialog" aria-label="Assistente" data-issue="#44 Copilot · query layer #12"><div class="dh"><div class="row" style="flex-wrap:nowrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg><div><h3>Assistente</h3><div class="xs muted">Risponde dai dati già raccolti da MatchPilot, con fonte e regola usata</div></div></div><button class="btn s" data-close>Chiudi</button></div>
    <div class="db" id="chat" style="flex:1"><div class="msg a">Chiedimi qualsiasi cosa sullo storico, sulle partite di oggi o sulle tue strategie. Trasformo la domanda in una regola e la eseguo sul database.</div><div class="stack" style="gap:6px">${ex.map((x, i) => `<button class="mini" data-q="${i}" style="text-align:left;font-weight:600;padding:7px 10px">${esc(x)}</button>`).join('')}</div></div>
    <form id="askF" class="row" style="padding:12px 18px calc(12px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--line);flex-wrap:nowrap"><input type="text" id="askI" placeholder="Scrivi una domanda" style="flex:1" aria-label="Domanda"><button class="btn pri" type="submit">Chiedi</button></form></div></div>`;
  const answer = q => {
    const reg = /stagione|serie a/i.test(q), mmq = /profilo|money/i.test(q);
    const dsl = mmq ? { registry: 'money_management_profile', all: [{ field: 'profile', op: 'eq', value: 'Lay Score' }] } : reg ? { query: 'coverageSeasons', country: 'italy', league: 'serie-a' } : { all: [{ field: 'venue', op: 'eq', value: 'away' }, { field: 'prematch.away_odds', op: 'between', value: [3, 5] }, { field: 'live.minute', op: 'eq', value: 70 }, { field: 'live.score', op: 'eq', value: '1-0' }, { field: 'live.away.sot', op: 'gte', value: 3 }] };
    $('#chat').insertAdjacentHTML('beforeend', `<div class="msg u">${esc(q)}</div><div class="msg a stack" style="gap:10px">${mmq ? `<div>Il profilo <b>Lay Score v2</b> (liability fissa € 50) è usato da: ${usedBy('p3').map(x => esc(x.name)).join(', ') || 'nessuna strategia'}. Gli altri profili sono nella pagina Money Management.</div>` : reg ? '<div>Lo storico FutPythonTrader della Serie A va dalla stagione <b>2021-22</b> al <b>2026-27</b>: 6 stagioni su 6 con dati, 1.951 partite, quote 1X2 complete nel 99,7% e xG nel 68,0%. La parte coperta anche da TotalCorner sarà disponibile con la #20.</div>' : `<div>Ho trovato <b>4 partite</b>. In 3 l'ospite ha poi segnato. Sono troppo poche per trarne conclusioni.</div><div class="card"><div class="tw"><table><tbody>${[['21/09', 'Getafe – Sevilla', '1-1'], ['14/09', 'Lanús – Boca', '1-0'], ['30/08', 'Junior – Nacional', '1-1'], ['11/05', 'Elche – Huesca', '2-1']].map(r => `<tr><td class="num">${r[0]}</td><td>${r[1]}</td><td class="r num">${r[2]}</td></tr>`).join('')}</tbody></table></div></div>`}<details><summary class="xs muted" style="cursor:pointer">Regola usata · nessuna chiamata ai fornitori · 148 ms</summary><pre class="code" style="margin-top:6px">${esc(JSON.stringify(dsl, null, 2))}</pre></details></div>`);
    const box = $('#chat').closest('.drawer > div'); box.scrollTop = box.scrollHeight;
  };
  $('#askF').onsubmit = e => { e.preventDefault(); const v = $('#askI').value.trim(); if (v) { answer(v); $('#askI').value = ''; } };
  $('#chat').onclick = e => { const b = e.target.closest('[data-q]'); if (b) answer(ex[+b.dataset.q]); };
  $('#askI').focus();
}

/* ---------- avvio ---------- */
$('#bankV').textContent = eur(account().avail);
const route = h => { const m = /^ft-(\d{1,2})$/.exec(h); if (m) { RP.t = Math.min(95, +m[1]); go('ft'); try { history.replaceState(null, '', '#ft-' + RP.t); } catch {} return true; } if (VIEWS[h]) { go(h); return true; } return false; };
const start = (location.hash || '').slice(1);
if (!route(start)) go('home');
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v !== state.view) route(v); });
})();
</script>
