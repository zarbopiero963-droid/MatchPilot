:root{--bg:#0A0F17;--panel:#111823;--surface-2:#16202D;--surface-3:#1D2938;--hover:#1A2533;--line:#223042;--line-2:#2C3C51;
  --text:#E9EFF6;--ink-2:#C3CEDB;--muted:#8494A8;--accent:#FFB547;--accent-ink:#1A1205;--accent-soft:rgba(255,181,71,.13);
  --bad:#FF5F6D;--bad-bg:rgba(255,95,109,.14);--warn:#FF9A4D;--warn-bg:rgba(255,154,77,.14);--ok:#3BD69A;--ok-bg:rgba(59,214,154,.13);
  --back:#4EA8FF;--back-bg:rgba(78,168,255,.15);--lay:#FF7AA8;--lay-bg:rgba(255,122,168,.15);--info:#9C8CFF;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;--side:236px;--top:60px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
a:hover{color:#FFC978}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;margin:0}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:12px 0 8px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---- Shell: topbar, sidebar, main, bottom bar ---- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr);min-height:100vh}
.topbar{grid-column:1/-1;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(10,15,23,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.04em;line-height:1}
.brand b span{color:var(--accent)}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer;flex:none}
.iconbtn:hover{color:var(--text);border-color:var(--line-2)}
.iconbtn[aria-expanded="true"],.iconbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.burger{display:none}
.gsearch{position:relative;flex:1 1 360px;max-width:460px}
.gsearch input{width:100%;padding:8px 12px 8px 34px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.gsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gresults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);max-height:60vh;overflow:auto;padding:6px;z-index:60}
.gresults button{display:flex;width:100%;justify-content:space-between;gap:10px;text-align:left;padding:8px 10px;border:0;border-radius:8px;background:none;cursor:pointer}
.gresults button[aria-selected="true"],.gresults button:hover{background:var(--surface-3)}
.gresults .k{color:var(--muted);font-size:12px;flex:none}
.topright{margin-left:auto;display:flex;align-items:center;gap:8px}
.mode{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.06em;border:1px solid}
.mode.DEMO{color:var(--accent);border-color:rgba(255,181,71,.5);background:var(--accent-soft)}
.mode.REAL{color:var(--ok);border-color:rgba(59,214,154,.5);background:var(--ok-bg)}
.clock{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.side{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;border-right:1px solid var(--line);padding:14px 10px 24px;background:var(--bg)}
.side .grp{margin:10px 8px 4px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.side a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px}
.side a:hover{background:var(--hover);color:var(--text)}
.side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side a .cnt{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--bad);color:#fff;border-radius:999px;padding:0 7px}
.side svg{flex:none}
main{min-width:0;padding:22px 26px 60px;outline:none}
.wrap{max-width:1240px;margin:0 auto}
.foot{color:var(--muted);font-size:12.5px;margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
.bottombar{display:none}
.scrim{display:none}
/* ---- Page head, strips, chips ---- */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
.phead .sub{color:var(--muted);font-size:13px;margin-top:4px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.chip.REAL{color:var(--ok);background:var(--ok-bg)}.chip.DEMO{color:var(--accent);background:var(--accent-soft)}.chip.UNAVAILABLE{color:var(--muted);border-color:var(--line-2);background:transparent}
.chip.ok{color:var(--ok);background:var(--ok-bg)}.chip.bad{color:var(--bad);background:var(--bad-bg)}.chip.warn{color:var(--warn);background:var(--warn-bg)}
.chip.back{color:var(--back);background:var(--back-bg)}.chip.lay{color:var(--lay);background:var(--lay-bg)}.chip.info{color:var(--info);background:rgba(156,140,255,.14)}
.chip.live{color:#fff;background:var(--bad)}
.issue{display:none;font-family:var(--f-mono);font-size:10.5px;color:var(--info);border:1px dashed rgba(156,140,255,.5);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:middle}
body.dev .issue{display:inline-block}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px;border-radius:10px;margin-bottom:14px;font-size:13px;border:1px solid var(--line);background:var(--panel)}
.strip.DEMO{border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.06)}
.strip.UNAVAILABLE{border-style:dashed}
/* ---- Cards, grids, tables ---- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card>h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .right{margin-left:auto}
section.card+section.card,.stack>*+*{margin-top:14px}
.stack{display:flex;flex-direction:column}
.stack>*+*{margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi b{font-family:var(--f-mono);font-size:22px;font-weight:600}
.kpi small{color:var(--muted);font-size:12px}
dl.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;margin:0}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
th.sortable button{all:unset;cursor:pointer}
th.sortable button:focus-visible{outline:2px solid var(--accent)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--hover)}
.empty{padding:16px;border:1px dashed var(--line-2);border-radius:10px;color:var(--muted);text-align:center}
.state{padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.state.error{border-color:rgba(255,95,109,.55);background:var(--bad-bg)}
.state.partial{border-color:rgba(255,154,77,.55);background:var(--warn-bg)}
.state.okst{border-color:rgba(59,214,154,.5);background:var(--ok-bg)}
.state.loading{color:var(--muted)}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite linear;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
/* ---- Controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--text);white-space:nowrap;min-height:38px}
.btn:hover{background:var(--surface-3);color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:#FFC978}
.btn.danger{border-color:rgba(255,95,109,.6);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn[aria-busy="true"]{cursor:progress}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}

legend{color:var(--muted);font-size:13px;padding:0 4px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;min-height:32px}
.seg button:hover{color:var(--text)}

.tabs{display:flex;gap:2px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:9px 2px;color:var(--muted);font-weight:700;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}

.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:left .15s}

.mlist{display:flex;flex-direction:column}

.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--hover)}

.mrow .teams{min-width:0}
.mrow .teams a{display:flex;flex-direction:column;color:var(--text);text-decoration:none;font-weight:600;line-height:1.3}

.mrow .comp{font-size:12px;color:var(--muted);margin-top:3px}
.mrow .sc{font-family:var(--f-mono);font-weight:700;font-size:17px;text-align:center}
.odds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.odd{display:flex;flex-direction:column;align-items:center;padding:4px 4px;border-radius:7px;background:var(--surface-2);line-height:1.15;min-width:0;border:1px solid transparent}
.odd span{color:var(--muted);font-size:10.5px;font-weight:700;white-space:nowrap}
.odd b{font-family:var(--f-mono);font-size:13.5px;font-weight:600}
.odd.up b{color:var(--ok)}.odd.dn b{color:var(--bad)}
.odd.win{border-color:var(--ok)}
button.odd{cursor:pointer;color:inherit}
button.odd:hover{border-color:var(--accent)}
.dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.dates button{flex:none;display:flex;flex-direction:column;align-items:center;min-width:54px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;line-height:1.15}
.dates button small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.dates button b{font-family:var(--f-display);font-size:19px}
.dates button[aria-current="date"]{border-color:var(--accent);background:var(--accent-soft)}
.dates button .n{font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.form{display:inline-flex;gap:3px}
.fm{width:21px;height:21px;border-radius:5px;display:inline-grid;place-items:center;font-size:11px;font-weight:800}
.fm.W{background:var(--ok);color:#05261A}.fm.D{background:var(--surface-3);color:var(--ink-2)}.fm.L{background:var(--bad);color:#2B0509}
/* hero */
.hero{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#131c29,var(--panel));padding:16px 20px;margin-bottom:14px}
.hero .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px;font-weight:600}
.hero .board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:18px;margin:14px 0}
.hero .tm{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero .tm.r{align-items:flex-end;text-align:right}
.hero .tm b{font-family:var(--f-display);font-size:30px;line-height:1.05;overflow-wrap:anywhere}
.hero .mid{text-align:center}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1}
.hero .odds{grid-template-columns:repeat(6,minmax(0,1fr))}

.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}

.lcard .top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.lcard .mt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-weight:700}
.lcard .mt .s{font-family:var(--f-mono);text-align:right}

.bar2{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--surface-3)}

.bar2 i:first-child{background:var(--back)}.bar2 i:last-child{background:var(--lay)}

.pulse{animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.35}}
/* charts */
.chart{width:100%;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.cmp:last-child{border-bottom:0}
.cmp .l{text-align:center;color:var(--muted);font-size:12.5px;font-weight:600}
.cmp .v{font-family:var(--f-mono);font-weight:600}.cmp .v.r{text-align:right}
.cmp .v.best{color:var(--accent)}

.tl{display:flex;flex-direction:column;gap:4px;max-height:360px;overflow:auto}

.tl .min{font-family:var(--f-mono);color:var(--muted);text-align:right}

.drawer .db{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.drawer .df{padding:12px 16px;border-top:1px solid var(--line)}
.msg{padding:9px 12px;border-radius:10px;background:var(--surface-2);font-size:14px;max-width:92%}

.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.rel{position:relative}

.progress i{display:block;height:100%;background:var(--accent)}
.pill-ok{color:var(--ok)}.pill-bad{color:var(--bad)}
.notice{font-size:12.5px;color:var(--muted);margin-top:10px}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

// ---------------------------------------------------------------- backtest engine (#34) — DEMO archive
// Runs a definition over the finished DEMO matches of a period. Prematch strategies use the prematch prices; LIVE ones
// enter at the first minute where every condition holds (deterministic replay of the DEMO events).
function demoBacktest(def, cfg) {
  const issues = defIssues(def);
  if (issues.length) return {error: issues.join(' ')};
  const from = cfg.from, to = cfg.to;
  if (!validDay(from) || !validDay(to)) return {error: 'Periodo non valido.'};
  if (from > to) return {error: 'La data iniziale deve precedere quella finale.'};
  if ((parseDay(to) - parseDay(from)) / 86400000 > 400) return {error: 'Il periodo massimo è di 400 giorni.'};

  if (!(stakeFixed > 0)) return {error: 'La puntata deve essere maggiore di zero.'};
  if (!(c >= 0 && c < 1)) return {error: 'Commissione non valida.'};

  const bets = [], skipped = {}, byMonth = {}, curve = [{x: 0, y: 0}];
  let events = 0, plNet = 0, plGross = 0, comm = 0, staked = 0, exposure = 0;
  for (let d = from; d <= to; d = addDays(d, 1)) {
    if (d >= today()) break;
    for (const m of demoDay(d)) {
      events++;
      let ev, entryMinute = null;
      if (def.phase === 'LIVE') {
        for (let minute = 1; minute < 90; minute++) {
          const st = stateAt(m, minute);
          const r = evaluateDef(def, m, {...st, minute});
          if (r.trade) { ev = r; entryMinute = minute; break; }
        }
        if (!ev) { skipped.CONDITIONS = (skipped.CONDITIONS ?? 0) + 1; continue; }
      } else {
        ev = evaluateDef(def, m);
        if (!ev.trade) { skipped[ev.reason] = (skipped[ev.reason] ?? 0) + 1; continue; }
      }
      let stake = stakeFixed;
      if (cfg.mm_model) {
        const r = mmEvaluate({model: cfg.mm_model, value: cfg.mm_value, side: def.side, odds: ev.price, available: cash});
        if (r.error) return {error: r.error};
        if (r.decision === 'BLOCK') { skipped.MONEY = (skipped.MONEY ?? 0) + 1; continue; }
        stake = r.stake;
      }
      const win = winsSelection(def.market, ev.sel, m.final);
      const gross = legPL({side: def.side, odds: ev.price, stake}, win);
      const fee = gross > 0 ? gross * c : 0;
      const net = gross - fee;
      cash += net; plNet += net; plGross += gross; comm += fee; staked += stake; exposure += liabilityOf(def.side, ev.price, stake);
      peak = Math.max(peak, cash); maxDd = Math.max(maxDd, peak - cash);
      const month = d.slice(0, 7);
      byMonth[month] = byMonth[month] ?? {bets: 0, net: 0}; byMonth[month].bets++; byMonth[month].net += net;
      bets.push({date: d, id: m.id, match: `${m.home} – ${m.away}`, comp: m.comp.name, sel: ev.sel, side: def.side, odds: ev.price, stake: r2(stake),
        minute: entryMinute, score: m.final.join('–'), win, net: r2(net)});
      curve.push({x: bets.length, y: r2(plNet)});
    }
  }
  const won = bets.filter(b => b.win).length;
  return {kind: 'BACKTEST', src: 'DEMO', def: JSON.parse(JSON.stringify(def)), cfg: {...cfg}, events, bets, won, lost: bets.length - won, skipped,
    staked: r2(staked), exposure: r2(exposure), plGross: r2(plGross), commission: r2(comm), plNet: r2(plNet), roi: exposure ? plNet / exposure : null,
    strike: bets.length ? won / bets.length : null, avgOdds: bets.length ? bets.reduce((x, b) => x + b.odds, 0) / bets.length : null,
    maxDrawdown: r2(maxDd), finalCash: r2(cash), byMonth, curve, ranAt: new Date().toISOString()};
}

function openAssistant() {

  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } });

    h('div', {class: 'dh'}, icon('chat'), h('b', {}, 'Assistente'), chip('DEMO', 'Assistente deterministico: nessun modello AI'), h('span', {style: {flex: '1'}}),
      h('button', {class: 'iconbtn', type: 'button', 'aria-label': 'Chiudi', ctl: 'CTL-ASSIST-CLOSE', onclick: closeDrawer}, icon('x'))),
    log,
    h('div', {class: 'df'}, h('div', {class: 'row', style: {marginBottom: '8px'}},

  document.body.append(d);
  log.append(h('div', {class: 'msg'}, 'Assistente deterministico di MatchPilot: risponde con i dati dell’app, senza modelli AI (nessuna API AI autorizzata, #44). Scrivi «aiuto» per l’elenco delle domande.'));
  input.focus();
}
function closeDrawer() { $('.drawer')?.remove(); }
function ask(q, log) {
  log.append(h('div', {class: 'msg me'}, q));
  const a = answer(q.toLowerCase());
  log.append(h('div', {class: 'msg', 'data-intent': a.intent}, a.text, a.link ? [' ', h('a', {href: a.link, ctl: 'CTL-ASSIST-LINK', onclick: closeDrawer}, a.linkText ?? 'Apri')] : null,
    h('span', {class: 'src'}, `fonte: ${a.source}`)));
  log.scrollTop = log.scrollHeight;
}
function answer(q) {
  const live = () => demoDay(today()).map(withState).filter(m => m.status === 'LIVE' || m.status === 'HT');
  const numIn = re => { const m = re.exec(q); return m ? Number(m[1].replace(',', '.')) : null; };
  if (/aiuto|help|cosa puoi/.test(q)) return {intent: 'help', source: 'assistente', text: 'Domande: «partite live», «partite di oggi», «forma <squadra>», «quote <squadra>», «stato del conto», «strategie salvate», «kelly quota X prob Y», «vai a <pagina>».'};
  if (isReal() && !/vai a|apri|kelly/.test(q)) return {intent: 'real', source: 'assistente', text: 'In modalità REAL l’assistente risponde solo a «vai a <pagina>» e «kelly»: le altre risposte usano i dati DEMO.'};
  if (/live|in diretta/.test(q)) { const l = live(); return {intent: 'live', source: 'demo.liveState', text: l.length ? `${l.length} partite in diretta: ${l.slice(0, 5).map(m => `${m.home} ${m.score.join('–')} ${m.away} (${m.status === 'HT' ? 'int.' : `${m.minute}'`})`).join('; ')}.` : 'Nessuna partita in diretta in questo momento.', link: href('live'), linkText: 'Apri Live'}; }
  if (/oggi|palinsesto/.test(q)) { const d = demoDay(today()); return {intent: 'today', source: 'demo.day', text: `${d.length} partite oggi in ${new Set(d.map(m => m.comp.id)).size} campionati.`, link: href('dashboard'), linkText: 'Apri la Dashboard'}; }
  if (/kelly/.test(q)) {
    const o = numIn(/quota\s*([\d.,]+)/), p = numIn(/prob\w*\s*([\d.,]+)/);
    if (!o || !p) return {intent: 'kelly', source: 'tools.kelly', text: 'Scrivi ad esempio «kelly quota 2,2 prob 50».'};
    try { const r = LOCAL_TOOLS.kelly({odds: o, probability: p, bankroll: settings().bankroll}); return {intent: 'kelly', source: 'tools.kelly (calcolo locale)', text: `Kelly pieno ${pct(r.full)}: su ${money(settings().bankroll)} la puntata è ${money(r.stake)}.`, link: href('tools', {tool: 'kelly', odds: o, probability: p, bankroll: settings().bankroll, run: 1}), linkText: 'Apri in Strumenti'}; }
    catch (e) { return {intent: 'kelly', source: 'tools.kelly', text: e.message}; }
  }
  if (/conto|portafoglio|bankroll/.test(q)) { const st = ledgerState(ledgerLoad()); return {intent: 'account', source: 'ledger (DEMO)', text: `Disponibile ${money(st.available)}, impegnato ${money(st.reserved)}, profitto realizzato ${money(st.realized)}, ${st.open} posizioni aperte.`, link: href('paper'), linkText: 'Apri il conto'}; }
  if (/strategi/.test(q)) { const l = lib.strategies(); return {intent: 'strategies', source: 'strategy lab (DEMO)', text: l.length ? `${l.length} strategie: ${l.map(x => `${x.name} v${x.version}`).join(', ')}.` : 'Nessuna strategia salvata.', link: href('strategies'), linkText: 'Apri Strategy Lab'}; }
  const team = COMPS.flatMap(c => c.teams).find(t => q.includes(t.toLowerCase()));
  if (team && /forma|statistic|come va/.test(q)) {
    const w = demoTeamAnalysis(team, today()).venues.both.windows['5'];
    return {intent: 'form', source: 'analysis.windowStats (DEMO)', text: `${team}, ultime ${w.n}: ${w.form.map(f => ({W: 'V', D: 'N', L: 'P'})[f.result]).join(' ')} · gol fatti ${nf(w.gfAvg)} e subiti ${nf(w.gaAvg)} a partita.`, link: href('analysis', {team}), linkText: 'Apri l’analisi'};
  }
  if (team && /quot/.test(q)) {
    const m = [0, 1, 2, 3, 4, 5, 6].flatMap(i => demoDay(addDays(today(), i))).find(x => x.home === team || x.away === team);
    return m ? {intent: 'odds', source: 'demo.day', text: `${m.home} – ${m.away} (${dayShort(m.date)} ${m.ko}): 1 ${odd(m.odds.h)} · X ${odd(m.odds.d)} · 2 ${odd(m.odds.a)}.`, link: href('match', {id: m.id}), linkText: 'Apri la partita'}
      : {intent: 'odds', source: 'demo.day', text: `Nessuna partita di ${team} nei prossimi 7 giorni.`};
  }
  const page = [...VIEWS.values()].find(v => q.includes(v.title.toLowerCase()));
  if (page) return {intent: 'nav', source: 'navigazione', text: `Pagina «${page.title}».`, link: href(page.id), linkText: 'Apri'};
  return {intent: 'unknown', source: 'assistente', text: 'Non so rispondere a questa domanda. Scrivi «aiuto» per vedere cosa posso fare.'};

// Re-render the current view in place (live data), without the loading state and only if nothing else happened.
let refreshing = false;
async function refreshInPlace() {
  if (refreshing || $('#overlay') || document.activeElement?.matches('input, select, textarea')) return;
  const {name, params} = parseHash();
  const v = VIEWS.get(name);
  if (!v) return;
  refreshing = true;
  const mine = generation;
  try {
    const nodes = await v.render(params, {mine, alive: () => mine === generation, refresh: true});
    if (mine === generation) { const y = window.scrollY; $('#view').replaceChildren(...[nodes].flat(Infinity).filter(Boolean)); window.scrollTo(0, y); }
  } catch { /* the next tick tries again */ } finally { refreshing = false; }
}

// ================================================================ Trading Copilot (UI-11, #102 #28) — advisory only
function copilotState(def, m) {
  if (m.status === 'NS') { const r = def.phase === 'LIVE' ? null : evaluateDef(def, m); return {state: r?.trade ? 'ARMED' : r?.near ? 'NEAR_MATCH' : 'PREMATCH', r, why: def.phase === 'LIVE' ? 'Strategia live: attende il calcio d’inizio.' : r?.trade ? 'Condizioni pre-partita soddisfatte.' : 'Condizioni pre-partita non soddisfatte.'}; }
  if (m.status === 'FT' || m.status === 'NR') return {state: 'EXPIRED', why: 'Partita conclusa.'};
  if (!def.phase || def.phase !== 'LIVE') return {state: 'NO_TRADE', why: 'Strategia pre-partita: non opera in diretta.'};
  if (['STALE', 'OFFLINE'].includes(m.fresh?.state)) return {state: 'BLOCKED', why: 'Dati fermi: nessuna decisione su dati non freschi.'};
  const l = ledgerLoad();
  if (l.mode !== 'ACTIVE_OPERATIONAL') return {state: 'BLOCKED', why: `Operatività: ${MODES[l.mode]}.`};
  if ((m.minute ?? 0) >= 85) return {state: 'EXPIRED', why: 'Oltre l’85°: finestra di ingresso chiusa.'};
  const r = evaluateDef(def, m, {score: m.score, live: m.live, minute: m.minute});
  if (r.reason === 'TEAM' || r.reason === 'COMPETITION') return {state: 'INVALIDATED', why: 'La partita non rientra nella strategia.'};
  return {state: r.trade ? 'ARMED' : r.near ? 'NEAR_MATCH' : 'WATCHING', r, why: r.trade ? 'Tutte le condizioni sono soddisfatte.' : r.near ? 'Condizioni vicine alla soglia.' : 'In osservazione.'};
}

async function runAutotest() {
  if (APP.testing) return;
  const real = {mode: APP.mode, ns: NS, offset: APP.clockOffset, hash: location.hash};
  APP.testing = true; APP.downloads = [];
  const t0 = performance.now();
  store.clearNs('mp.test.'); NS = 'mp.test.';
  APP.mode = 'DEMO';
  // A fixed match day: next Saturday at 16:10 local time (first-half 15:00 matches live, 18:00 and 20:45 to play).
  const now = new Date(); const sat = new Date(now.getFullYear(), now.getMonth(), now.getDate() + ((6 - now.getDay() + 7) % 7 || 7), 16, 10);
  APP.clockOffset = sat.getTime() - Date.now(); dayCache.clear();
  const results = [], controls = {};
  const progress = h('div', {class: 'toast', role: 'status', style: {position: 'fixed', bottom: '16px', right: '16px', left: 'auto', zIndex: 95}}, 'Autotest in corso…');
  document.body.append(progress);
  for (const [id, title, fn] of SCENARIOS) {
    progress.textContent = `Autotest: ${id} — ${title}`;
    const t = new Tester();
    let error = null;
    try { closeDialog(); closeDrawer(); closeMenus(); await fn(t); } catch (e) { error = e.message; }
    closeDialog(); closeDrawer(); closeMenus();
    results.push({id, title, result: error ? 'FAIL' : 'PASS', error, controls: [...t.used]});
    for (const c of t.used) {
      const x = controls[c] ?? {result: 'PASS', tests: []};
      x.tests.push(id);
      if (error) x.result = 'FAIL';
      controls[c] = x;
    }
  }
  controls['CTL-COV-RUN'] = {result: 'PASS', tests: ['avvio manuale']};
  for (const [c, why] of Object.entries(BLOCKED_IN_FILE)) if (why && !controls[c]) controls[c] = {result: 'BLOCKED', tests: [], reason: why};
  // Controls a scenario failed on before reaching them stay NOT_RUN; controls never rendered are listed by the test page.
  store.clearNs('mp.test.');
  NS = real.ns; APP.mode = real.mode; APP.clockOffset = real.offset; dayCache.clear();
  const record = {at: new Date().toISOString(), mode: 'DEMO', build: BUILD.version, ms: performance.now() - t0, userAgent: navigator.userAgent.replace(/\s*\(.*?\)\s*/g, ' ').slice(0, 120),
    viewport: `${innerWidth}×${innerHeight}`, scenarios: results, controls, downloads: APP.downloads.length, unknownIds: [...UNKNOWN]};
  writeRaw('autotest', record);
  APP.testing = false;
  progress.remove();
  const failed = results.filter(r => r.result === 'FAIL').length;
  toast(failed ? `Autotest: ${failed} scenari falliti su ${results.length}` : `Autotest superato: ${results.length} scenari`, failed ? 'bad' : 'ok');
  location.hash = href('coverage', {tab: 'autotest'});
  if (real.hash === location.hash) render();
  window.__autotest = record;
  return record;
}
window.MatchPilot = {runAutotest, specs: () => [...SPECS.values()], seen: () => [...SEEN.keys()], unknown: () => [...UNKNOWN], audit: () => auditDom(document), build: BUILD};
