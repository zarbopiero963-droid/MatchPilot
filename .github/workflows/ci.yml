name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: matchpilot
          POSTGRES_PASSWORD: matchpilot_local_test
          POSTGRES_DB: matchpilot_fpt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchpilot -d matchpilot_fpt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FUTPYTHON_TEST_DATABASE_URL: postgres://matchpilot:matchpilot_local_test@127.0.0.1:5432/matchpilot_fpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
