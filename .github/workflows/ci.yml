name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      categories: ${{ steps.classify.outputs.categories }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - id: classify
        name: Select required suites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-classify.mjs

  fast:
    name: Fast checks
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Classifier regression tests
        run: node --test test/ci-classify.test.mjs
      - name: Governance gate (inventory, owner decisions, checkpoints, registry)
        run: |
          npm run governance:validate
          npm run governance:check
          node tools/governance/render-inventory.mjs --check
          node --test test/requirements-inventory.test.mjs test/governance-*.test.mjs
      - name: Reject auto-closing issue references
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run governance:scan-closing
          node tools/governance/cli.mjs check-append-only
      - name: Syntax checks
        if: needs.classify.outputs.mode != 'docs'
        run: npm run check

  ui:
    name: UI checks
    needs: classify
    if: needs.classify.outputs.mode == 'ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/mockup-alignment.test.mjs

  full:
    name: PostgreSQL integration suite
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: matchpilot
          POSTGRES_PASSWORD: matchpilot_local_test
          POSTGRES_DB: matchpilot_fpt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchpilot -d matchpilot_fpt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FUTPYTHON_TEST_DATABASE_URL: postgres://matchpilot:matchpilot_local_test@127.0.0.1:5432/matchpilot_fpt
      # R-05 browser E2E (test/web-e2e.test.mjs): the runner's preinstalled Chrome, driven by playwright-core.
      MATCHPILOT_E2E_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  # Browser QA Gate (MP-OWNER-BROWSER-QA-HARD-GATE-01): every web change runs the required journeys in a real Chrome on
  # a throwaway PostgreSQL, verifies the evidence against the PR head and keeps it as an artifact. Zero new services.
  browser_qa:
    name: Browser QA
    needs: classify
    if: needs.classify.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: matchpilot
          POSTGRES_PASSWORD: matchpilot_local_test
          POSTGRES_DB: matchpilot_fpt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchpilot -d matchpilot_fpt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FUTPYTHON_TEST_DATABASE_URL: postgres://matchpilot:matchpilot_local_test@127.0.0.1:5432/matchpilot_fpt
      MATCHPILOT_E2E_CHROME: /usr/bin/google-chrome
      QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run the required browser journeys
        run: node tools/qa/browser-qa.mjs --out qa-evidence
      - name: Verify the evidence against the PR head
        if: always()
        run: node tools/qa/verify-report.mjs qa-evidence --head "$QA_HEAD_SHA" --commit "$(git rev-parse HEAD)"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-qa-${{ env.QA_HEAD_SHA }}
          path: qa-evidence
          retention-days: 14
          if-no-files-found: error

  gate:
    name: CI gate
    if: always()
    needs: [classify, fast, ui, full, browser_qa]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ needs.classify.outputs.mode }}
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      FAST_RESULT: ${{ needs.fast.result }}
      UI_RESULT: ${{ needs.ui.result }}
      FULL_RESULT: ${{ needs.full.result }}
      WEB: ${{ needs.classify.outputs.web }}
      BROWSER_QA_RESULT: ${{ needs.browser_qa.result }}
    steps:
      - name: Enforce selected checks
        shell: bash
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success
          test "$FAST_RESULT" = success
          case "$MODE" in
            docs)
              test "$UI_RESULT" = skipped
              test "$FULL_RESULT" = skipped
              ;;
            ui)
              test "$UI_RESULT" = success
              test "$FULL_RESULT" = skipped
              ;;
            full)
              test "$UI_RESULT" = skipped
              test "$FULL_RESULT" = success
              ;;
            *)
              echo "Unsafe classifier mode: $MODE" >&2
              exit 1
              ;;
          esac
          # WEB CHANGE + NO VERIFIED BROWSER QA = MERGE BLOCKED.
          case "$WEB" in
            true) test "$BROWSER_QA_RESULT" = success ;;
            false) test "$BROWSER_QA_RESULT" = skipped ;;
            *)
              echo "Unsafe web classification: $WEB" >&2
              exit 1
              ;;
          esac
