name: Provider trial keepalive

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-trial-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TRIAL_URL: https://betsapi-trial-collector.onrender.com/healthz
      TRIAL_KEEPALIVE_UNTIL: '2026-10-06T00:00:00Z'
    steps:
      - name: Skip after trial window
        id: gate
        shell: bash
        run: |
          now="$(date -u +%s)"
          end="$(date -u -d "$TRIAL_KEEPALIVE_UNTIL" +%s)"
          if [ "$now" -ge "$end" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Trial keepalive window ended at $TRIAL_KEEPALIVE_UNTIL"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping collector
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 20 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            -H 'User-Agent: matchpilot-provider-trial-github-keepalive/1.0' \
            "$TRIAL_URL"
